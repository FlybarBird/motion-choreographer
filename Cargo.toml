[workspace]
resolver = "2"
members = ["crates/core", "crates/scene", "crates/server", "crates/panel", "crates/app"]

[workspace.package]
version = "0.2.19"
edition = "2021"
license = "MIT"
rust-version = "1.95"

[workspace.dependencies]
ptz-core = { path = "crates/core" }
ptz-scene = { path = "crates/scene" }
ptz-panel = { path = "crates/panel" }
serde = { version = "1", features = ["derive"] }
# float_roundtrip: the run log hashes numbers as written, so they must read back exactly.
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "fs", "process", "signal"] }
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"
cpal = "0.18"
symphonia = { version = "0.6", default-features = false, features = ["wav", "aiff", "mp3", "pcm"] }
rubato = "5"
audioadapter-buffers = "5"
midir = "0.11"
socket2 = { version = "0.6", features = ["all"] }
ureq = { version = "3", default-features = false, features = ["json"] }
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
md-5 = "0.10"
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
egui = "0.36"
egui_dock = { version = "0.21", features = ["serde"] }
egui_kittest = "0.36"
egui-phosphor = "0.14"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
rfd = "0.18"
dirs = "6"
# Checks the signature on an update before it is installed.
ed25519-dalek = { version = "3", default-features = false }

[workspace.lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"

[profile.dev.package.ptz-core]
opt-level = 2

# The renderer is a pixel loop: unoptimised it is too slow to judge.
[profile.dev.package.ptz-scene]
opt-level = 3
